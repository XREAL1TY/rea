name: Sync Fork with Upstream

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main
          target_repo_token: ${{ secrets.UPSTREAM_SYNC_PAT }}
          upstream_sync_repo: morluto/rea
          upstream_sync_branch: main
