name: Sync Fork with Upstream

on:
  schedule:
    # 每天北京时间 09:17 自动同步
    - cron: "17 1 * * *"

  # 允许手动执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Sync Upstream
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream main

          git merge --no-commit --no-ff upstream/main

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git restore --source=HEAD --staged --worktree .github/workflows

            if git diff --staged --quiet; then
              echo "Only workflow changes detected; skipping sync commit."
              git merge --abort
              exit 0
            fi

            git commit -m "chore: sync upstream main"
            git push origin HEAD:main
          else
            echo "Already up to date."
          fi
